name: Talon
description: >-
  Talon (Talon Cyber Security) was an enterprise browser security company that
  built a secure, isolated Chromium-based browser for protecting SaaS and web
  application access on managed and unmanaged devices, with controls for data
  loss prevention, zero-trust access, and endpoint posture. Surfaced as a
  portfolio lead of Lightspeed Venture Partners, the company was acquired by
  Palo Alto Networks in December 2023 and its product was folded into the Palo
  Alto Networks Prisma Access Browser (Prisma SASE). Talon no longer operates as
  an independent company: its former domain (talon-sec.com) redirects to the
  Palo Alto Networks Prisma Browser product page, and no independent public
  developer portal, API documentation, or public API surface was found during
  enrichment. This profile is retained as a company record for network history.
